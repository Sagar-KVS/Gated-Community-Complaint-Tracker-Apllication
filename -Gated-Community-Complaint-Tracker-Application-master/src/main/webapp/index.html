<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Complaint Tracker - Login</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #74ebd5, #ACB6E5);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        background: #ffffff;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        text-align: center;
        width: 350px;
    }

    h1 {
        margin-bottom: 25px;
        font-size: 22px;
        color: #333;
    }

    label {
        display: block;
        text-align: left;
        font-weight: bold;
        margin-bottom: 5px;
        color: #444;
    }

    input {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #4CAF50;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s;
    }

    button:hover {
        background: #45a049;
    }

    p {
        margin-top: 15px;
        font-size: 14px;
        color: #333;
    }

    a {
        color: #007BFF;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>
    <div class="container">
        <h1>Welcome To Complaint Tracker</h1>
        <form action="LoginServlet" method="post">
            <label for="email">Email :</label>
            <input type="email" name="email" placeholder="Enter email" required>

            <label for="password">Password :</label>
            <input type="password" name="password" placeholder="Enter Password" required>

            <button type="submit">LOGIN</button>
        </form>
        <p>New User? <a href="signup.jsp">Signup</a></p>
    </div>
</body>
</html>
